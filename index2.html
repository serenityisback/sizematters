
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Terminal</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    background: #030705;
    color: #39ff88;
    font-family: Consolas, monospace;
  }

  .terminal {
    width: 100%;
    max-width: 460px;
    padding: 28px;
    border: 1px solid #1c6539;
    background: #07100b;
    box-shadow: 0 0 35px #0b512526;
  }

  h1 {
    font-size: 23px;
    letter-spacing: 3px;
    text-shadow: 0 0 12px #39ff88;
  }

  .muted { color: #55936a; font-size: 12px; }

  input, button {
    width: 100%;
    padding: 13px;
    margin-top: 12px;
    font: inherit;
  }

  input {
    background: #030705;
    border: 1px solid #246b40;
    color: #39ff88;
    outline: none;
  }

  button {
    background: #123e25;
    border: 1px solid #39ff88;
    color: #b7ffce;
    cursor: pointer;
  }

  button:hover { background: #205d36; }

  #message { min-height: 20px; font-size: 13px; }

  #secret { display: none; margin-top: 25px; }

  .cursor {
    animation: blink 1s steps(2) infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
  <main class="terminal">
    <p class="muted">1117</p>
    <h1>access</h1>
    <p class="muted">the three prime numbers</p>

    <form id="login">
      <label for="password">enter number</label>
      <input id="password" type="password"
        placeholder="••••••••••••" required>
      <button type="submit">[ AUTHENTICATE ]</button>
    </form>

    <p id="message" role="status"></p>

    <section id="secret">
      <h2>ACCESS GRANTED</h2>
      <p>welcome to moth 1117.</p>
      <p>https://drive.google.com/drive/folders/1nPJAgm0IB-WiZy1y9ABq5o70WA2ntHZj?usp=sharing.</p>
      <p class="muted">SYSTEM STATUS: UNLOCKED<span
        class="cursor">_</span></p>
    </section>

    <p class="muted">UNAUTHORIZED ACCESS IS NOT PERMITTED_</p>
  </main>

  <script>
    // DEMO ONLY: this is not secure for private information.
    const ACCESS_CODE = "874857857";

    document.getElementById("login").addEventListener(
      "submit", function(event) {
        event.preventDefault();

        const password =
          document.getElementById("password").value;
        const message = document.getElementById("message");

        if (password === ACCESS_CODE) {
          document.getElementById("secret").style.display =
            "block";
          message.textContent = "ACCESS GRANTED.";
          document.getElementById("login").style.display =
            "none";
        } else {
          message.textContent = "ACCESS DENIED. TRY AGAIN.";
          document.getElementById("password").value = "";
        }
      }
    );
  </script>
</body>
</html>
